<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da Casa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="theme-color" content="#0e5a5f">
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#14232b;--mut:#62767d;--line:#d8e2e0;--ac:#0e5a5f;--acl:#d5ebe9;--bad:#b4412f;--ok:#2d7a4f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1e;--card:#172429;--ink:#e6efee;--mut:#8fa5ab;--line:#26373d;--ac:#4fb3b8;--acl:#1d3a3e;--bad:#ef8a76;--ok:#6cc294}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 14px}
h2{font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mes b{font-size:1.15rem;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
button{background:var(--acl);border:0;border-radius:9px;padding:8px 13px;cursor:pointer;color:var(--ac);font-weight:600}
button.pri{background:var(--ac);color:var(--card)}button.del{color:var(--bad)}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
.sal{font-family:Georgia,serif;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}.in{color:var(--ok)}.over{color:var(--bad)}
.dia{width:34px;text-align:center;font-weight:700;color:var(--ac)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.grid small{color:var(--mut);display:block}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:12px 2px;font-size:.8rem;color:var(--mut)}nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
dialog{border:0;border-radius:14px;width:min(92vw,420px);background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:#0008}
.pg{width:70px}.chk{width:22px;height:22px;accent-color:var(--ac);flex:none}
.vazio{color:var(--mut);text-align:center;padding:14px 0}
.fab{display:flex;gap:8px;margin:8px 0}.fab button{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const TABS=[['resumo','Resumo'],['contas','Contas'],['renda','Renda'],['plano','Plano'],['ajustes','Ajustes']];
const PAL=['#0e5a5f','#d98a2b','#7a5ea8','#c2483a','#3f8f5a','#2f6fa8','#b05a8a','#7d8a2e','#8a6d4a','#5b6b73'];
const DEF=[['Moradia',30],['Alimentação',15],['Transporte',10],['Saúde',5],['Educação',5],['Lazer',10],['Dívidas',5],['Poupança',20]];
let S;try{S=JSON.parse(localStorage.getItem('contas'))}catch(e){}
S=S||{inc:[],bills:[],paid:{},cats:DEF.map((c,i)=>({id:'c'+i,n:c[0],p:c[1],c:PAL[i]}))};
let tab='resumo',M=new Date().toISOString().slice(0,7);
const save=()=>{try{localStorage.setItem('contas',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));
const shift=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.toISOString().slice(0,7)};
const mesNome=m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const cat=id=>S.cats.find(c=>c.id===id)||{n:'Sem categoria',c:'#9aa7ab',p:0};
const TIPO={fix:'Fixa',var:'Variável',par:'Parcelada'};

function ocorr(m){const o=[];
 for(const b of S.bills){const s=b.d.slice(0,7),dia=+b.d.slice(8);
  if(b.t==='var'){if(s===m)o.push({b,dia,k:b.id+m})}
  else if(b.t==='fix'){if(s<=m&&(!b.fim||b.fim>=m))o.push({b,dia,k:b.id+m})}
  else{const i=md(s,m);if(i>=0&&i<b.np)o.push({b,dia,k:b.id+m,x:`${i+1}/${b.np}`})}}
 return o.sort((a,b)=>a.dia-b.dia)}
const rendas=()=>S.inc.slice().sort((a,b)=>a.dia-b.dia);

function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 const mes=['resumo','contas','plano'].includes(tab)?`<div class="mes"><button onclick="M=shift(M,-1);render()">‹</button><b>${mesNome(M)}</b><button onclick="M=shift(M,1);render()">›</button></div>`:'';
 $('#app').innerHTML=mes+VIEWS[tab]();window.scrollTo(0,0)}

function porCat(oc){const t={};oc.forEach(x=>t[x.b.c]=(t[x.b.c]||0)+x.b.v);return t}
function donut(t,tot){if(!tot)return'<div class="vazio">Sem gastos neste mês.</div>';
 let off=0;const seg=Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{const p=v/tot*100,s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${cat(id).c}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"/>`;off+=p;return[s,id,v,p]});
 return `<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 42 42" width="140" style="transform:rotate(-90deg);flex:none">${seg.map(s=>s[0]).join('')}</svg><div style="flex:1">${seg.map(s=>`<div style="display:flex;justify-content:space-between;font-size:.9rem"><span><i class="dot" style="background:${cat(s[1]).c}"></i>${esc(cat(s[1]).n)}</span><b>${s[3].toFixed(0)}%</b></div>`).join('')}</div></div>`}

const VIEWS={
resumo(){const oc=ocorr(M),ren=rendas().reduce((a,r)=>a+r.v,0),gas=oc.reduce((a,x)=>a+x.b.v,0),pago=oc.filter(x=>S.paid[x.k]).reduce((a,x)=>a+x.b.v,0),sal=ren-gas;
 const ev=[...rendas().map(r=>({dia:r.dia,n:r.n,v:r.v,in:1})),...oc.map(x=>({dia:x.dia,n:x.b.nome,v:x.b.v,x:x.x,c:x.b.c}))].sort((a,b)=>a.dia-b.dia);
 return `<div class="card"><small style="color:var(--mut)">Sobra prevista no mês</small><div class="sal ${sal<0?'over':''}">${R(sal)}</div>
 <div class="grid" style="margin-top:10px"><div><small>Entra</small><b class="in">${R(ren)}</b></div><div><small>Sai</small><b>${R(gas)}</b></div><div><small>Falta pagar</small><b>${R(gas-pago)}</b></div></div></div>
 <h2>Para onde vai o dinheiro</h2><div class="card">${donut(porCat(oc),gas)}</div>
 <h2>Calendário do mês</h2><div class="card">${ev.length?ev.map(e=>`<div class="row"><div class="dia">${e.dia}</div><div class="t">${esc(e.n)}<small>${e.in?'Recebimento':esc(cat(e.c).n)+(e.x?' · parcela '+e.x:'')}</small></div><div class="v ${e.in?'in':''}">${e.in?'+':'−'}${R(e.v)}</div></div>`).join(''):'<div class="vazio">Nada lançado ainda.</div>'}</div>`},
contas(){const oc=ocorr(M);
 const bloco=(t,tit)=>{const l=oc.filter(x=>t==='par'?x.b.t==='par':x.b.t===t);return `<h2>${tit} · ${R(l.reduce((a,x)=>a+x.b.v,0))}</h2><div class="card">${l.length?l.map(x=>`<div class="row"><input type="checkbox" class="chk" ${S.paid[x.k]?'checked':''} onchange="pay('${x.k}',this.checked)"><div class="dia">${x.dia}</div><div class="t" onclick="formConta('${x.b.id}')" style="cursor:pointer">${esc(x.b.nome)}<small>${esc(cat(x.b.c).n)}${x.x?' · parcela '+x.x:''}</small></div><div class="v">${R(x.b.v)}</div></div>`).join(''):'<div class="vazio">Nenhuma.</div>'}</div>`};
 return `<div class="fab"><button class="pri" onclick="formConta()">+ Nova conta</button></div>${bloco('fix','Fixas')}${bloco('var','Variáveis')}${bloco('par','Parceladas')}<small style="color:var(--mut)">Marque o quadrado quando pagar. Toque no nome para editar.</small>`},
renda(){return `<div class="fab"><button class="pri" onclick="formRenda()">+ Novo salário / entrada</button></div><div class="card">${rendas().length?rendas().map(r=>`<div class="row" onclick="formRenda('${r.id}')" style="cursor:pointer"><div class="dia">${r.dia}</div><div class="t">${esc(r.n)}<small>Todo dia ${r.dia}</small></div><div class="v in">${R(r.v)}</div></div>`).join(''):'<div class="vazio">Cadastre salários e o dia em que caem.</div>'}</div>`},
plano(){const ren=rendas().reduce((a,r)=>a+r.v,0),t=porCat(ocorr(M)),sp=S.cats.reduce((a,c)=>a+c.p,0);
 return `<div class="card"><small style="color:var(--mut)">Renda do mês</small><div class="sal">${R(ren)}</div>${sp!==100?`<div class="over" style="margin-top:6px">As metas somam ${sp}%. Ajuste para fechar 100%.</div>`:''}</div>
 <h2>Ideal × real por categoria</h2>${S.cats.map(c=>{const ideal=ren*c.p/100,real=t[c.id]||0,pc=ideal?Math.min(real/ideal*100,100):(real?100:0),exc=real>ideal+.005;
 return `<div class="card"><div style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${c.c}"></i><b style="flex:1">${esc(c.n)}</b><input class="pg" type="number" min="0" max="100" value="${c.p}" onchange="setP('${c.id}',this.value)">%</div>
 <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.9rem"><span>Ideal ${R(ideal)}</span><span class="${exc?'over':''}">Real ${R(real)}</span></div><div class="bar"><i style="width:${pc}%;background:${exc?'var(--bad)':c.c}"></i></div>
 <small style="color:var(--mut)">${exc?'Acima do ideal em '+R(real-ideal):'Ainda cabe '+R(ideal-real)}</small></div>`}).join('')}`},
ajustes(){return `<h2>Categorias</h2><div class="card">${S.cats.map(c=>`<div class="row" onclick="formCat('${c.id}')" style="cursor:pointer"><i class="dot" style="background:${c.c}"></i><div class="t">${esc(c.n)}</div><span class="v">${c.p}%</span></div>`).join('')}</div><div class="fab"><button onclick="formCat()">+ Categoria</button></div>
 <h2>Backup</h2><div class="card"><small style="color:var(--mut)">Os dados ficam só neste aparelho. Exporte de vez em quando.</small><div class="fab"><button onclick="exporta()">Exportar</button><button onclick="$('#imp').click()">Importar</button></div><input id="imp" type="file" accept=".json" hidden onchange="importa(this.files[0])"></div>`}
};

function pay(k,v){v?S.paid[k]=1:delete S.paid[k];save();render()}
function setP(id,v){cat(id).p=Math.max(0,+v||0);save();render()}
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}
const fechar=()=>$('#dlg').close();
const val=id=>$('#'+id).value;

function formConta(id){const b=S.bills.find(x=>x.id===id)||{t:'fix',v:'',nome:'',c:S.cats[0]?.id,d:M+'-01',np:2};
 dlg(`<form method="dialog" onsubmit="return false"><b>${id?'Editar':'Nova'} conta</b>
 <label>Nome</label><input id="n" value="${esc(b.nome)}">
 <label>Valor (R$)${b.t==='par'?' de cada parcela':''}</label><input id="v" type="number" step="0.01" inputmode="decimal" value="${b.v}">
 <label>Tipo</label><select id="t" onchange="$('#pn').style.display=this.value==='par'?'block':'none'">${Object.entries(TIPO).map(([k,l])=>`<option value="${k}" ${b.t===k?'selected':''}>${l}</option>`).join('')}</select>
 <div id="pn" style="display:${b.t==='par'?'block':'none'}"><label>Número de parcelas</label><input id="np" type="number" min="2" value="${b.np||2}"></div>
 <label>Data (1º vencimento ou data do gasto)</label><input id="d" type="date" value="${b.d}">
 <label>Categoria</label><select id="c">${S.cats.map(c=>`<option value="${c.id}" ${b.c===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
 <label>Fixa: encerrar em (opcional)</label><input id="fim" type="month" value="${b.fim||''}">
 <div class="fab" style="margin-top:14px"><button onclick="fechar()">Cancelar</button>${id?`<button class="del" onclick="delConta('${id}')">Excluir</button>`:''}<button class="pri" onclick="saveConta('${id||''}')">Salvar</button></div></form>`);
}
function saveConta(id){const nome=val('n').trim(),t=val('t'),b={id:id||uid(),nome,v:+val('v'),t,d:val('d'),c:val('c'),fim:t==='fix'?(val('fim')||null):null,np:t==='par'?Math.max(2,+val('np')||2):0};
 if(!nome||!b.v||!b.d)return alert('Preencha nome, valor e data.');
 S.bills=S.bills.filter(z=>z.id!==id);S.bills.push(b);save();fechar();render()}
function delConta(id){if(confirm('Excluir esta conta (todos os meses)?')){S.bills=S.bills.filter(x=>x.id!==id);save();fechar();render()}}

function formRenda(id){const r=S.inc.find(x=>x.id===id)||{n:'',v:'',dia:5};
 dlg(`<form method="dialog" onsubmit="return false"><b>${id?'Editar':'Nova'} entrada</b><label>Nome (ex: Salário Alex)</label><input id="n" value="${esc(r.n)}"><label>Valor (R$)</label><input id="v" type="number" step="0.01" inputmode="decimal" value="${r.v}"><label>Dia do recebimento</label><input id="dia" type="number" min="1" max="31" value="${r.dia}">
 <div class="fab" style="margin-top:14px"><button onclick="fechar()">Cancelar</button>${id?`<button class="del" onclick="S.inc=S.inc.filter(x=>x.id!=='${id}');save();fechar();render()">Excluir</button>`:''}<button class="pri" onclick="saveRenda('${id||''}')">Salvar</button></div></form>`)}
function saveRenda(id){const o={id:id||uid(),n:val('n').trim(),v:+val('v'),dia:Math.min(31,Math.max(1,+val('dia')||1))};if(!o.n||!o.v)return alert('Preencha nome e valor.');S.inc=S.inc.filter(x=>x.id!==id);S.inc.push(o);save();fechar();render()}

function formCat(id){const c=S.cats.find(x=>x.id===id)||{n:'',p:0,c:PAL[S.cats.length%PAL.length]};
 dlg(`<form method="dialog" onsubmit="return false"><b>${id?'Editar':'Nova'} categoria</b><label>Nome</label><input id="n" value="${esc(c.n)}"><label>Meta (% da renda)</label><input id="p" type="number" min="0" max="100" value="${c.p}"><label>Cor</label><input id="cor" type="color" value="${c.c}">
 <div class="fab" style="margin-top:14px"><button onclick="fechar()">Cancelar</button>${id?`<button class="del" onclick="delCat('${id}')">Excluir</button>`:''}<button class="pri" onclick="saveCat('${id||''}')">Salvar</button></div></form>`)}
function saveCat(id){const n=val('n').trim();if(!n)return;const c=S.cats.find(x=>x.id===id);if(c){c.n=n;c.p=+val('p')||0;c.c=val('cor')}else S.cats.push({id:uid(),n,p:+val('p')||0,c:val('cor')});save();fechar();render()}
function delCat(id){if(S.bills.some(b=>b.c===id))return alert('Há contas usando esta categoria. Mude a categoria delas antes.');S.cats=S.cats.filter(c=>c.id!==id);save();fechar();render()}

function exporta(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='contas-backup.json';a.click()}
function importa(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.cats||!d.bills)throw 0;S=d;save();render()}catch(e){alert('Arquivo inválido.')}})}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
